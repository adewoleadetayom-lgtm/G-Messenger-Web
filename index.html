<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e8">
<title>G Messenger</title>
<style>
:root{--blue:#1769e8;--blue2:#eaf2ff;--bg:#f7f9fc;--card:#fff;--text:#142033;--muted:#718096;--line:#e7ecf3;--green:#19a463;--purple:#7856d6}
*{box-sizing:border-box}body{margin:0;background:#dfe7f2;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text)}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg);box-shadow:0 0 35px #0002;position:relative}
.top{padding:18px 18px 10px;background:var(--card);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{font-size:25px;margin:0;color:var(--blue)}.icons{display:flex;gap:8px}.icon{width:40px;height:40px;border-radius:14px;background:#f2f6fb;color:#334155}
.search{margin-top:12px;background:#f1f5f9;border-radius:15px;padding:11px 14px;display:flex;gap:9px}.search input{border:0;outline:0;background:transparent;width:100%}
.tabs{display:flex;gap:8px;overflow:auto;margin-top:11px}.tab{padding:8px 13px;border-radius:18px;background:#f0f4f8;color:#5b6678;white-space:nowrap}.tab.active{background:var(--blue);color:white}
.content{padding:12px 14px 92px}.row{display:flex;gap:12px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line);background:transparent}.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6ea8ff,#1769e8);color:#fff;font-weight:700;flex:none}.rowmain{flex:1;min-width:0}.name{font-weight:700}.snippet{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.time{font-size:11px;color:#8a94a5}.badge{background:var(--blue);color:#fff;border-radius:12px;padding:3px 7px;font-size:11px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 5px env(safe-area-inset-bottom);z-index:10}.nav{background:none;color:#778294;padding:6px 2px;font-size:11px}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:var(--blue)}
.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:82px;background:var(--blue);color:#fff;border-radius:18px;width:54px;height:54px;font-size:25px;box-shadow:0 8px 20px #1769e855}
.section{font-size:13px;color:#7a8596;font-weight:700;margin:15px 4px 7px;text-transform:uppercase;letter-spacing:.05em}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.btn{background:var(--blue);color:white;border-radius:14px;padding:12px 16px;font-weight:700}.btn.secondary{background:#eef4ff;color:var(--blue)}.btn.ghost{background:#f1f4f8;color:#475569}
.form{display:grid;gap:12px}.field{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 14px}.field label{display:block;font-size:11px;color:#7b8798;margin-bottom:4px}.field input,.field textarea{border:0;outline:0;width:100%;background:transparent}.field textarea{min-height:80px;resize:vertical}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{background:#eef3f9;border-radius:12px;width:40px;height:40px}.pagehead h2{margin:0;font-size:21px}.chat{display:flex;flex-direction:column;gap:8px;min-height:70vh}.bubble{max-width:78%;padding:11px 13px;border-radius:17px;background:#fff;border:1px solid var(--line);align-self:flex-start}.bubble.me{background:#dceaff;color:#0f376f;align-self:flex-end}.compose{position:sticky;bottom:68px;background:var(--bg);padding:8px 0;display:flex;gap:7px}.compose input{flex:1;border:1px solid var(--line);border-radius:17px;padding:12px;background:white;outline:0}.circle{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.setting{display:flex;justify-content:space-between;align-items:center;padding:15px 5px;border-bottom:1px solid var(--line)}.setting small{color:var(--muted);display:block;margin-top:3px}
.logo{width:74px;height:74px;border-radius:25px;background:var(--blue);color:white;display:grid;place-items:center;font-size:40px;font-weight:800;margin:20px auto 12px}.center{text-align:center}.muted{color:var(--muted)}.empty{text-align:center;padding:55px 20px;color:var(--muted)}
</style>
</head>
<body><main class="app" id="app">
<section class="content center">
<div class="logo">G</div>
<h1>G Messenger</h1>
<p class="muted">Loading G Messenger...</p>
<button class="btn" onclick="location.reload()">Open G Messenger</button>
</section>
</main>
<script>
const KEY="gm_web_state_v1";
let state;
try {
  state=JSON.parse(localStorage.getItem(KEY)||"null");
} catch(e) {
  localStorage.removeItem(KEY);
  state=null;
}
state=state||{
 user:{name:"",phone:"",bio:"",avatar:""}, theme:"light",
 chats:[
  {id:"official",name:"G Messenger",msg:"Welcome to G Messenger!",time:"Now",official:true},
  {id:"mercy",name:"Mercy",msg:"Welcome! 👋",time:"9:30 AM"},
  {id:"john",name:"John",msg:"Hello there",time:"9:12 AM"}
 ], current:null, messages:{official:[["G Messenger","Welcome to the official G Messenger channel. Updates from the G Messenger team will appear here."]],mercy:[["Mercy","Hi! Welcome to G Messenger." ]],john:[["John","Hello!"]]},
 statuses:[], communities:[{name:"G Messenger Community",sub:"Announcements"}], calls:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function initials(n){return (n||"G").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function nav(active){return `<nav class="bottom">${["chats","updates","communities","calls"].map((x,i)=>`<button class="nav ${active===x?"active":""}" onclick="go('${x}')"><b>${["💬","◉","👥","☎"][i]}</b>${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</nav>`}
function top(title,search=true){return `<header class="top"><div class="brand"><h1>${title}</h1><div class="icons"><button class="icon" onclick="go('settings')">⚙</button></div></div>${search?`<div class="search">⌕ <input placeholder="Ask Gemma AI or Search" oninput="filterChats(this.value)"></div>`:""}</header>`}
function render(){let p=location.hash.slice(1)||"chats"; if(p.startsWith("chat/")) return chat(p.split("/")[1]); if(p==="new-contact")return newContact(); if(p==="new-community")return newCommunity(); if(p==="add-status")return addStatus(); if(p==="gemma")return gemma(); if(p==="profile")return profile(); if(p==="settings")return settings(); if(p==="about")return about(); if(p==="chats")return chats(); if(p==="updates")return updates(); if(p==="communities")return communities(); if(p==="calls")return calls(); go("chats")}
function go(p){location.hash=p}
window.addEventListener("hashchange",render); window.addEventListener("load",render);

function chats(){document.getElementById("app").innerHTML=top("G Messenger")+`<section class="content"><div class="tabs"><button class="tab active">All</button><button class="tab">Unread</button><button class="tab">Groups</button><button class="tab">Favorites</button></div><div id="chatlist">${state.chats.map(c=>`<div class="row" data-name="${esc(c.name).toLowerCase()}" onclick="go('chat/${c.id}')"><div class="avatar">${initials(c.name)}</div><div class="rowmain"><div class="name">${esc(c.name)} ${c.official?"✓":""}</div><div class="snippet">${esc(c.msg)}</div></div><div class="time">${esc(c.time)}</div></div>`).join("")}</div><div class="card" onclick="go('gemma')" style="cursor:pointer"><b>✨ Gemma AI</b><div class="snippet">Summarize, explain, rewrite or translate on this device.</div></div></section>${nav("chats")}<button class="fab" onclick="newChat()">＋</button>`}
function filterChats(v){document.querySelectorAll("#chatlist .row").forEach(r=>r.style.display=r.dataset.name.includes(v.toLowerCase())?"flex":"none")}
function newChat(){let n=prompt("Contact name");if(!n)return;let id="c"+Date.now();state.chats.unshift({id,name:n,msg:"New chat",time:"Now"});state.messages[id]=[];save();go("chat/"+id)}
function chat(id){let c=state.chats.find(x=>x.id===id)||{id,name:"Chat"};if(!state.messages[id])state.messages[id]=[];document.getElementById("app").innerHTML=`<header class="top"><div class="pagehead"><button class="back" onclick="go('chats')">‹</button><div class="avatar" style="width:42px;height:42px">${initials(c.name)}</div><div><h2>${esc(c.name)} ${c.official?"✓":""}</h2><small class="muted">${c.official?"Official G Messenger":"online"}</small></div></div></header><section class="content"><div class="chat" id="msgs">${state.messages[id].map(m=>`<div class="bubble ${m[0]===(state.user.name||"You")?"me":""}">${esc(m[1])}</div>`).join("")}</div><div class="compose"><button class="circle" onclick="alert('Attachment picker is ready for your browser.')">📎</button><input id="msg" placeholder="Message" onkeydown="if(event.key==='Enter')sendMsg('${id}')"><button class="circle" onclick="sendMsg('${id}')">➤</button></div></section>${nav("chats")}`}
function sendMsg(id){let el=document.getElementById("msg"),v=el.value.trim();if(!v)return;let who=state.user.name||"You";state.messages[id].push([who,v]);let c=state.chats.find(x=>x.id===id);if(c){c.msg=v;c.time="Now"}save();render();setTimeout(()=>document.getElementById("msgs")?.scrollTo(0,99999),20)}

function updates(){document.getElementById("app").innerHTML=top("Updates",false)+`<section class="content"><div class="section">Status</div><div class="card"><div class="row" style="border:0"><div class="avatar">＋</div><div class="rowmain"><b onclick="go('add-status')">Add status</b><div class="snippet">Share a photo, text or update</div></div></div>${state.statuses.map(s=>`<div class="row"><div class="avatar">${initials(s.name)}</div><div class="rowmain"><b>${esc(s.name)}</b><div class="snippet">${esc(s.text)}</div></div></div>`).join("")}</div><div class="section">Channels</div><div class="card" onclick="go('chat/official')" style="cursor:pointer"><div class="row" style="border:0"><div class="avatar">G</div><div class="rowmain"><b>G Messenger ✓</b><div class="snippet">Official G Messenger updates</div></div></div></div></section>${nav("updates")}`}
function addStatus(){document.getElementById("app").innerHTML=`<section class="content"><div class="pagehead"><button class="back" onclick="go('updates')">‹</button><h2>Add status</h2></div><div class="form"><div class="field"><label>STATUS</label><textarea id="st" placeholder="Write an update..."></textarea></div><button class="btn" onclick="state.statuses.unshift({name:state.user.name||'My status',text:document.getElementById('st').value});save();go('updates')">Post status</button></div></section>${nav("updates")}`}

function communities(){document.getElementById("app").innerHTML=top("Communities",false)+`<section class="content"><button class="btn" onclick="go('new-community')">＋ New community</button>${state.communities.map(c=>`<div class="card"><div class="row" style="border:0;padding:4px"><div class="avatar">👥</div><div class="rowmain"><b>${esc(c.name)}</b><div class="snippet">${esc(c.sub)}</div></div></div></div>`).join("")}</section>${nav("communities")}`}
function newCommunity(){document.getElementById("app").innerHTML=`<section class="content"><div class="pagehead"><button class="back" onclick="go('communities')">‹</button><h2>New community</h2></div><div class="form"><div class="field"><label>COMMUNITY NAME</label><input id="cn" placeholder="Community name"></div><div class="field"><label>DESCRIPTION</label><textarea id="cd" placeholder="Tell people what this community is about"></textarea></div><button class="btn" onclick="state.communities.push({name:document.getElementById('cn').value||'My Community',sub:document.getElementById('cd').value||'General discussion'});save();go('communities')">Create community</button></div></section>`}

function calls(){document.getElementById("app").innerHTML=top("Calls",false)+`<section class="content"><div class="grid"><button class="btn secondary" onclick="alert('Call keypad opened')">☎ Keypad</button><button class="btn secondary" onclick="alert('Video calling UI opened')">▣ Video call</button></div><div class="section">Recent</div>${state.calls.length?state.calls.map(x=>`<div class="row"><div class="avatar">${initials(x)}</div><div class="rowmain"><b>${esc(x)}</b><div class="snippet">Outgoing call</div></div><div>☎</div></div>`).join(""):`<div class="empty">No recent calls yet.</div>`}</section>${nav("calls")}`}
function gemma(){document.getElementById("app").innerHTML=`<section class="content"><div class="pagehead"><button class="back" onclick="go('chats')">‹</button><div><h2>Gemma AI</h2><small class="muted">On-device • no API key</small></div></div><div class="card"><b>✨ Gemma</b><p class="muted">I can help with quick local text actions in this web version.</p></div><div class="grid"><button class="btn secondary" onclick="ai('summarize')">Summarize</button><button class="btn secondary" onclick="ai('explain')">Explain</button><button class="btn secondary" onclick="ai('rewrite')">Rewrite</button><button class="btn secondary" onclick="ai('translate')">Translate</button></div><div class="field" style="margin-top:12px"><label>ASK GEMMA</label><textarea id="aiin" placeholder="Type or paste text..."></textarea></div><button class="btn" style="width:100%" onclick="ai('answer')">Ask Gemma</button><div id="aiout"></div></section>`}
function ai(mode){let t=document.getElementById("aiin").value.trim()||"G Messenger is a modern messaging app with Chats, Updates, Communities and Calls.";let out={summarize:"Summary: "+t.split(/[.!?]/)[0]+".",explain:"Explanation: This text communicates its main idea clearly. In a full local model build, Gemma can provide a deeper explanation.",rewrite:"Rewrite: "+t,translate:"Translation: A language model can translate this text locally when a language model is bundled.",answer:"Gemma: I understand. You entered: "+t}[mode];document.getElementById("aiout").innerHTML=`<div class="bubble" style="margin-top:12px">${esc(out)}</div>`}
function newContact(){document.getElementById("app").innerHTML=`<section class="content"><div class="pagehead"><button class="back" onclick="go('chats')">‹</button><h2>New contact</h2></div><div class="form"><div class="field"><label>FULL NAME</label><input id="nn" placeholder="Full name"></div><div class="field"><label>PHONE NUMBER</label><input id="np" placeholder="+234 ..."></div><div class="field"><label>G MESSENGER ID</label><input placeholder="gm_..."></div><button class="btn" onclick="let n=document.getElementById('nn').value||'New Contact';let id='c'+Date.now();state.chats.unshift({id,name:n,msg:'Contact added',time:'Now'});state.messages[id]=[];save();go('chats')">Save contact</button></div></section>`}
function profile(){document.getElementById("app").innerHTML=`<section class="content"><div class="pagehead"><button class="back" onclick="go('settings')">‹</button><h2>Profile</h2></div><div class="center"><div class="logo">${initials(state.user.name||"G")}</div><h2>${esc(state.user.name||"Your name")}</h2><p class="muted">${esc(state.user.phone||"Add your phone number")}</p></div><div class="form"><div class="field"><label>NAME</label><input id="pn" value="${esc(state.user.name)}"></div><div class="field"><label>PHONE</label><input id="pp" value="${esc(state.user.phone)}"></div><div class="field"><label>ABOUT</label><textarea id="pb">${esc(state.user.bio)}</textarea></div><button class="btn" onclick="state.user.name=document.getElementById('pn').value;state.user.phone=document.getElementById('pp').value;state.user.bio=document.getElementById('pb').value;save();go('settings')">Save changes</button></div></section>`}
function settings(){document.getElementById("app").innerHTML=top("Settings",false)+`<section class="content"><div class="card" onclick="go('profile')" style="cursor:pointer"><div class="row" style="border:0"><div class="avatar">${initials(state.user.name||"G")}</div><div class="rowmain"><b>${esc(state.user.name||"Set up your profile")}</b><small class="muted">${esc(state.user.phone||"Profile & account")}</small></div>›</div></div><div class="section">Account</div>${["Privacy","Security","Notifications","Chats","Storage and data","Linked devices"].map(x=>`<div class="setting"><span>${x}<small>Manage ${x.toLowerCase()}</small></span><b>›</b></div>`).join("")}<div class="section">App</div><div class="setting" onclick="toggleTheme()"><span>Appearance<small>${state.theme==="dark"?"Dark":"Light"} theme</small></span><b>☼</b></div><div class="setting" onclick="go('about')"><span>About G Messenger<small>Version Web 1.0</small></span><b>›</b></div></section>`}
function toggleTheme(){state.theme=state.theme==="dark"?"light":"dark";save();document.documentElement.style.setProperty("--bg",state.theme==="dark"?"#101722":"#f7f9fc");document.documentElement.style.setProperty("--card",state.theme==="dark"?"#17202d":"#fff");document.documentElement.style.setProperty("--text",state.theme==="dark"?"#eef4ff":"#142033");render()}
function about(){document.getElementById("app").innerHTML=`<section class="content center"><div class="logo">G</div><h1>G Messenger</h1><p class="muted">Fast. Secure. Beautiful.</p><div class="card" style="text-align:left"><b>Independent web version</b><p class="muted">This website opens directly without the verification page. It uses its own browser storage, so it does not alter the Android app.</p></div><button class="btn" onclick="go('chats')">Back to G Messenger</button></section>`}
</script></body></html>
